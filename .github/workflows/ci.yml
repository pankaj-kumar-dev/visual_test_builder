name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Generate exported-spec fixture
        run: npm run generate:export-fixture

      - name: Type-check exported spec against real Cypress types
        run: npm run typecheck:export-fixture

      - name: Install Cypress binary
        run: npx cypress install

      - name: Start dev server
        run: nohup npm run dev -- --port 5173 > /tmp/vite-dev.log 2>&1 &

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Dev server is up."
              exit 0
            fi
            sleep 2
          done
          echo "Dev server did not come up in time." >&2
          cat /tmp/vite-dev.log
          exit 1

      - name: Cypress smoke suite
        run: npm run cy:run

      - name: Run the generated exported spec for real
        run: npx cypress run --spec cypress/e2e/generated/exported-dashboard.cy.ts

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
